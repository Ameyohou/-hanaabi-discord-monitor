name: Live delivery check
on:
  push:
    paths:
      - 'integration_check.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: instagram-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name != 'schedule' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      STATE_BACKEND: github
      STATE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_API_VERSION: ${{ vars.META_API_VERSION }}
      BBC_TEST_ENABLED: ${{ vars.BBC_TEST_ENABLED }}
      RESPECT_INTERVAL: 'true'
      FORCE_CHECK: ${{ github.event_name != 'schedule' && inputs.respect_interval != true && 'true' || 'false' }}
      RESUME_META: ${{ inputs.resume_meta == true && 'true' || 'false' }}
      INITIALIZE: ${{ inputs.initialize == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Live isolated delivery and restart test
        run: python integration_check.py
      - name: Report state or configuration failure
        if: failure()
        run: python ops_alert.py
      - name: Preserve recovery journal on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/runtime/
          retention-days: 7
          if-no-files-found: ignore
