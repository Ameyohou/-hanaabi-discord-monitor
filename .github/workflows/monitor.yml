name: Instagram monitor
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      initialize:
        description: '初回のみtrue（既存投稿は通知しない）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: instagram-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Configure state commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          INITIALIZE: ${{ inputs.initialize == true && 'true' || 'false' }}
          PERSIST_GIT: 'true'
        run: python monitor.py
