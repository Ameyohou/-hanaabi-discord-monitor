name: Instagram monitor
on:
  schedule:
    # More wake opportunities; persistent due gate allows one API check per UTC half-hour slot.
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    paths:
      - '.github/workflows/monitor.yml'
  workflow_dispatch:
    inputs:
      initialize:
        description: '初回のみ（既存の状態はリセットしません）'
        type: boolean
        default: false
      respect_interval:
        description: '外部スケジューラ用。同じ30分枠の確認をスキップ'
        type: boolean
        default: false
      resume_meta:
        description: 'Metaの本人確認・制限解除と接続テストの成功後だけ選択'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: instagram-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name != 'schedule' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      STATE_BACKEND: github
      STATE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_API_VERSION: ${{ vars.META_API_VERSION }}
      BBC_TEST_ENABLED: 'false'
      RESPECT_INTERVAL: 'true'
      FORCE_CHECK: ${{ github.event_name != 'schedule' && inputs.respect_interval != true && 'true' || 'false' }}
      RESUME_META: ${{ inputs.resume_meta == true && 'true' || 'false' }}
      INITIALIZE: ${{ inputs.initialize == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Monitor both accounts
        run: python monitor.py --all
      - name: Daily status after 20 JST
        if: always()
        run: python daily_status.py
      - name: Report state or configuration failure
        if: failure()
        run: python ops_alert.py
      - name: Preserve recovery journal on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/runtime/
          retention-days: 7
          if-no-files-found: ignore
